# ─────────────────────────────────────────────────────────────
# Gravon.ai — Production Docker Compose
# Run with: docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────

services:
  # ── Nginx reverse proxy (public entry point) ──────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gravon

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    env_file:
      - ../backend/.env
    environment:
      - DEBUG=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/gravon/configs:/opt/gravon/configs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - gravon

  # ── Certbot (SSL — optional, enable when you have a domain)
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  gravon:
    driver: bridge
